# Invisible Exposure — all settings live here.
project: invisible-exposure
data_root: data
regions: [maricopa-az, northern-ca, eastern-ok, south-central-tx, eastern-wa]
state_fips: ["04", "06", "35", "40", "48", "53"]

challenge:
  base_https: https://data.source.coop/humane-intelligence/bias-bounty-mapping-equity-challenge
  local: data/raw/challenge

overture:
  # three snapshots for the catch-up analysis (H3)
  releases:
    r2023: {label: "2023-07-26.0", source: cholmes, path: "https://data.source.coop/cholmes/overture/geoparquet-country-quad-hive/country_iso=US/*.parquet"}
    r2026a: {label: "2026-08-19.0", source: challenge}
    r2026b: {label: "2026-10-21.0", source: s3, path: "s3://overturemaps-us-west-2/release/2026-10-21.0/theme=buildings/type=building/*"}
  places_r2026b: "s3://overturemaps-us-west-2/release/2026-10-21.0/theme=places/type=place/*"
  primary_release: r2026a

reference:
  usa_structures: "https://data.source.coop/wherobots/usa-structures/geoparquet/*.parquet"

acs:
  year: 2024
  base: https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/data/5YRData
  tables: [b25001, b25002, b25024, b01003, b25034, b11001, b26001]   # matches coverage_risk.features.TABLES

model:
  alpha: 0.10           # 90% conformal ranges
  seed: 20261109
  spatial_block_km: 50
  lgbm: {n_estimators: 600, learning_rate: 0.03, num_leaves: 31, min_child_samples: 20, subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8}

audit:
  fdr_q: 0.05

# Merged project (docs/merge_results.md): per-tract results imported from the sibling folders, never model inputs.
merge:
  mapequity_root: ../MapEquityChallenge     # base_table, audit_strata, model_inputs, OOF cache, mapequity package
  out: data/external/merged_inputs.csv
  seed_iforest: 20261025
